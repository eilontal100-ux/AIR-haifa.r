# Render Blueprint. Configure BASE_URL (and optionally ACCESS_CODE) in the Render dashboard.
databases:
  - name: air-haifa-swap-db
    databaseName: airhaifa_swap
    user: airhaifa
    plan: basic-256mb
services:
  - type: web
    name: air-haifa-swap
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm run db:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: air-haifa-swap-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: ACCESS_CODE
        sync: false
