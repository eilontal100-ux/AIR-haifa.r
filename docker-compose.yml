services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airhaifa
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: airhaifa_swap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airhaifa -d airhaifa_swap"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
